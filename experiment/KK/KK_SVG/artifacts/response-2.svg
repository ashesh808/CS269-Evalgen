    <use href="#blade" fill="#34A853" transform="rotate(270)"/>
  </g>
  <text x="140" y="97" fill="#202124" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="600" letter-spacing="-3">Google</text>
