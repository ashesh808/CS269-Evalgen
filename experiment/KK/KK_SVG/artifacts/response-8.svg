    <path d="M533 43v109c0 13 6 19 19 19" stroke="url(#green)"/>
    <path d="M574 126h90c0-25-19-45-45-45s-45 20-45 45 19 45 45 45c14 0 26-5 35-14" stroke="url(#red)"/>
