<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 245" role="img" aria-labelledby="title desc">
  <title id="title">Google, reimagined</title>
  <desc id="desc">A geometric Google wordmark drawn in luminous blue, red, gold, and green strokes.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3478f6"/>
      <stop offset="1" stop-color="#5149df"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fa514f"/>
      <stop offset="1" stop-color="#df2877"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffca36"/>
      <stop offset="1" stop-color="#f39324"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#19ba84"/>
      <stop offset="1" stop-color="#008b72"/>
