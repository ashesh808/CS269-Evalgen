# Vercel AI Gateway; the API key lives in .env as EVALGEN_API_KEY
[LLM]
base_url = "https://ai-gateway.vercel.sh/v1"
model = "openai/gpt-oss-20b"
temperature = 0.0 # suggestion and grading calls
sample_temperature = 0.9 # sampled pipeline outputs, so samples differ
timeout = 120.0 # seconds per call, so one stuck call fails over instead of stalling a run
max_retries = 1
verdict_max_tokens = 2048 # reasoning models can loop on a true/false answer
max_concurrency = 4

# Web app
[Server]
host = "127.0.0.1"
port = 8269

# Assertion generation and selection
[Eval]
assertions_per_criterion = 3
ffr_threshold = 0.4 # the paper started at 0.1 and needed 0.4 for its product pipeline
python_timeout = 3.0 # wall time per sandboxed candidate across the current output batch
python_max_concurrency = 2
